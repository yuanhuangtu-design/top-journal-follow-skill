<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目详情 — 顶刊文献追踪</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
.navbar { background: linear-gradient(135deg, #1a1a2e, #0f3460); color: white; padding: 0.8rem 2rem; display: flex; align-items: center; gap: 1rem; }
.navbar a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.9rem; }
.navbar a:hover { color: white; }
.navbar h1 { font-size: 1.1rem; flex: 1; }
.dashboard-frame { width: 100%; height: calc(100vh - 52px); border: none; }
</style>
</head>
<body>
<div class="navbar">
    <a href="/">← 返回</a>
    <h1>📄 {{ project.meta.query_raw[:50] or project.name }}</h1>
    <span style="font-size:0.8rem; opacity:0.7;">{{ project.meta.created_at or '' }}</span>
</div>
{% if dashboard_html %}
    <iframe class="dashboard-frame" srcdoc="{{ dashboard_html | safe }}"></iframe>
{% else %}
    <div style="text-align:center;padding:4rem 2rem;">
        <h2>⏳ 看板尚未生成</h2>
        <p style="color:#888;margin-top:0.5rem;">请等待流水线执行完成</p>
        <a href="/" class="btn" style="display:inline-block;margin-top:1rem;padding:0.6rem 1.5rem;background:#0f3460;color:white;border-radius:8px;text-decoration:none;">← 返回</a>
    </div>
{% endif %}
</body>
</html>
