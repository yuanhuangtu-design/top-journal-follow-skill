name: Daily Literature Report

on:
  schedule:
    # 北京时间05:00触发；GitHub实际启动可能延迟。
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "指定报告日期 YYYY-MM-DD（留空=今天）"
        required: false
        default: ""
      run_mode:
        description: "运行方式：正常日报、只读连接检查、仅补录已保存候选"
        type: choice
        options: [daily, check_connection, sync_pending]
        default: daily

permissions:
  contents: write

concurrency:
  group: daily-literature-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_MODE: ${{ inputs.run_mode || 'daily' }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
      FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
      FEISHU_EXPECTED_APP_ID: cli_aa5219a0e079dbf6
      FEISHU_REQUIRED: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Feishu synchronization
        run: python -m unittest discover -s tests -v

      - name: Check imported Feishu table
        if: env.RUN_MODE == 'check_connection'
        run: python scripts/feishu_sync.py --check

      - name: Sync saved candidates only
        if: env.RUN_MODE == 'sync_pending'
        run: python scripts/feishu_sync.py --flush-pending

      - name: Install dependencies
        if: env.RUN_MODE == 'daily'
        run: pip install --quiet requests deep-translator

      - name: Run daily literature pipeline
        if: env.RUN_MODE == 'daily'
        env:
          REPORT_DATE: ${{ inputs.report_date }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_PARENT_TYPE: ${{ vars.NOTION_PARENT_TYPE }}
        run: |
          args=()
          if [ -n "$REPORT_DATE" ]; then
            args+=(--date "$REPORT_DATE")
          fi
          python scripts/run_daily.py "${args[@]}"

      - name: Upload daily report and pending records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-literature-report
          path: |
            output/daily_report_*.html
            output/daily_report_*.json
            output/feishu_*.json
            reports/feishu_pending.json
          retention-days: 30

      - name: Commit latest report and pending queue
        if: ${{ always() && env.RUN_MODE != 'check_connection' }}
        run: |
          mkdir -p reports
          cp -f output/daily_report_latest.html reports/latest.html 2>/dev/null || true
          cp -f output/daily_report_latest.json reports/latest.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "docs: update literature report and pending queue"
            git push
          fi
