name: Daily Literature Report

on:
  schedule:
    # 北京时间05:17主触发，07:23和09:41检查补跑；GitHub实际启动可能延迟。
    - cron: "17 21 * * *"
    - cron: "23 23 * * *"
    - cron: "41 1 * * *"
    # 周日北京时间05:30生成不限期刊候选清单，不自动写入飞书。
    - cron: "30 21 * * 6"
  workflow_dispatch:
    inputs:
      report_date:
        description: "指定报告日期 YYYY-MM-DD（留空=今天）"
        required: false
        default: ""
      run_mode:
        description: "运行方式：正常日报、只读连接检查、仅补录已保存候选"
        type: choice
        options: [daily, backfill, weekly_candidates, check_connection, sync_pending, repair_titles, repair_rankings]
        default: daily
      groups:
        description: "补抓的检索组，例如 A（留空=全部组）"
        required: false
        default: ""
      edat_start:
        description: "补抓的 PubMed 入库起始日期 YYYY-MM-DD"
        required: false
        default: ""
      edat_end:
        description: "补抓的 PubMed 入库结束日期 YYYY-MM-DD"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-literature-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_MODE: ${{ inputs.run_mode || (github.event.schedule == '30 21 * * 6' && 'weekly_candidates') || 'daily' }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
      FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
      FEISHU_EXPECTED_APP_ID: cli_aa5219a0e079dbf6
      FEISHU_REQUIRED: "true"
      FEISHU_FILL_MISSING_TITLES: "true"
      FEISHU_FILL_MISSING_RANKINGS: "true"
      JOURNAL_RANKINGS_B64: ${{ secrets.JOURNAL_RANKINGS_B64 }}
      JOURNAL_RANKINGS_REQUIRED: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Queued scheduled retries must see the most recently committed report.
          ref: ${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record trigger details
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          result = {
              'event': os.environ['TRIGGER_EVENT'],
              'schedule': os.environ['TRIGGER_SCHEDULE'],
              'sha': os.environ['TRIGGER_SHA'],
              'mode': os.environ['RUN_MODE'],
              'started_utc': datetime.now(timezone.utc).isoformat(),
          }
          Path('output').mkdir(exist_ok=True)
          Path('output/trigger_details.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write('### Trigger details\n\n```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY

      - name: Check whether today's daily report is complete
        id: daily_guard
        run: python scripts/daily_schedule_guard.py

      - name: Test Feishu synchronization
        run: python -m unittest discover -s tests -v

      - name: Check representative paper coverage
        if: steps.daily_guard.outputs.should_run == 'true' && (env.RUN_MODE == 'daily' || env.RUN_MODE == 'backfill' || env.RUN_MODE == 'weekly_candidates')
        run: python scripts/check_coverage_examples.py

      - name: Check imported Feishu table
        if: env.RUN_MODE == 'check_connection'
        run: python scripts/feishu_sync.py --check

      - name: Sync saved candidates only
        if: env.RUN_MODE == 'sync_pending'
        run: python scripts/feishu_sync.py --flush-pending

      - name: Fill empty Chinese titles only
        if: env.RUN_MODE == 'repair_titles'
        run: python scripts/feishu_sync.py --fill-titles

      - name: Fill missing journal rankings
        if: env.RUN_MODE == 'repair_rankings'
        run: python scripts/feishu_sync.py --fill-rankings

      - name: Refresh rankings in saved daily report
        if: env.RUN_MODE == 'repair_rankings'
        run: python scripts/refresh_report_rankings.py

      - name: Install dependencies
        if: steps.daily_guard.outputs.should_run == 'true' && (env.RUN_MODE == 'daily' || env.RUN_MODE == 'backfill')
        run: pip install --quiet requests deep-translator

      - name: Run daily literature pipeline
        if: steps.daily_guard.outputs.should_run == 'true' && (env.RUN_MODE == 'daily' || env.RUN_MODE == 'backfill')
        env:
          REPORT_DATE: ${{ inputs.report_date }}
          SEARCH_GROUPS: ${{ inputs.groups }}
          EDAT_START: ${{ inputs.edat_start }}
          EDAT_END: ${{ inputs.edat_end }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_PARENT_TYPE: ${{ vars.NOTION_PARENT_TYPE }}
        run: |
          args=()
          if [ -n "$REPORT_DATE" ]; then
            args+=(--date "$REPORT_DATE")
          fi
          if [ "$RUN_MODE" = "backfill" ]; then
            test -n "$EDAT_START" && test -n "$EDAT_END"
            args+=(--edat-start "$EDAT_START" --edat-end "$EDAT_END")
            if [ -n "$SEARCH_GROUPS" ]; then
              args+=(--groups "$SEARCH_GROUPS")
            fi
          fi
          python scripts/run_daily.py "${args[@]}"

      - name: Build weekly candidate pool without Feishu writes
        if: env.RUN_MODE == 'weekly_candidates'
        run: python scripts/run_daily.py --candidate-pool

      - name: Build weekly neuroscience journal list
        if: ${{ !cancelled() && env.RUN_MODE == 'weekly_candidates' }}
        run: python scripts/run_daily.py --neuroscience-pool

      - name: Upload daily report and pending records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-literature-report
          path: |
            output/daily_report_*.html
            output/daily_report_*.json
            output/feishu_*.json
            output/trigger_details.json
            reports/feishu_pending.json
            reports/title_translations.json
            reports/search_progress.json
            reports/weekly_candidates.*
            reports/weekly_neuroscience.*
          retention-days: 30

      - name: Commit latest report and pending queue
        if: ${{ always() && env.RUN_MODE != 'check_connection' && steps.daily_guard.outputs.should_run == 'true' }}
        run: |
          mkdir -p reports
          cp -f output/daily_report_latest.html reports/latest.html 2>/dev/null || true
          cp -f output/daily_report_latest.json reports/latest.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "docs: update literature report and pending queue"
            git push
          fi
