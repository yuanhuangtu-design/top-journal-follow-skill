name: Daily Literature Report

on:
  schedule:
    # 每天 21:00 UTC = 05:00 北京时间（GitHub免费账户cron延迟约3小时，预计08:00左右跑完）
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "报告日期 YYYY-MM-DD（默认今天，自动补抓缺口）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-literature-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test reliability
        run: python -m unittest discover -s tests -v

      - name: Run daily literature pipeline
        env:
          REPORT_DATE: ${{ inputs.report_date }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_PARENT_TYPE: ${{ vars.NOTION_PARENT_TYPE }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
        run: |
          args=()
          if [ -n "$REPORT_DATE" ]; then
            args+=(--date "$REPORT_DATE")
          fi
          python scripts/run_daily.py "${args[@]}"

      - name: Upload daily report (HTML + JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-literature-report
          path: |
            output/daily_report_*.html
            output/daily_report_*.json
            reports/pipeline_state.json
          retention-days: 30

      - name: Commit latest report back to repository
        if: always()
        run: |
          mkdir -p reports
          cp -f output/daily_report_latest.html reports/latest.html 2>/dev/null || true
          cp -f output/daily_report_latest.json reports/latest.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "docs: update daily literature report"
            git push
          fi
